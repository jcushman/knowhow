[project]
name = "knowhow"
version = "0.1.0"
description = "Live group knowhow elicitation: phones coach paired interviews, an agent drafts a playbook and concept map"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jack Cushman", email = "jcushman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
knowhow = "knowhow.cli:main"

[project.optional-dependencies]
asr = ["mlx-whisper"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
