<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowhow</title>
<style>
  body { margin:0; background:#F5F6F4; color:#1B1F23; font-family:-apple-system, system-ui, sans-serif; padding:48px 24px; }
  form { max-width:360px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  label { font-weight:600; }
  input { font:inherit; font-size:20px; height:52px; padding:0 12px; border:1px solid #DADDD8; border-radius:10px; text-transform:uppercase; }
  button { font:inherit; font-size:17px; font-weight:600; height:56px; border:none; border-radius:12px; background:#0F6E6E; color:#fff; }
</style>
</head>
<body>
<form onsubmit="location.href='/g/' + encodeURIComponent(this.code.value.trim().toUpperCase()); return false;">
  <label for="code">Group code from your handout</label>
  <input id="code" name="code" autocomplete="off" required>
  <button>Join</button>
</form>
</body>
</html>
